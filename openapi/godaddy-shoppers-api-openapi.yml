            schema:
              $ref: '#/components/schemas/Secret'
        description: The value to set the subaccount's password to
        required: true
components:
  schemas:
    Shopper:
      properties:
        customerId:
          description: Identifier for the Customer record associated with this Shopper record. This is an alternate identifier that some systems use to identify an individual shopper record
          type: string
        email:
          format: email
          type: string
        externalId:
          type: integer
        marketId:
          default: en-US
          format: bcp-47
          type: string
        nameFirst:
          type: string
        nameLast:
          type: string
        shopperId:
          type: string
      required:
      - shopperId
      - nameFirst
      - nameLast
      - email
      - marketId
    SubaccountCreate:
      properties:
        email:
          format: email
          type: string
        externalId:
          type: integer
        marketId:
          default: en-US
          format: bcp-47
          type: string
          maxLength: 50
          enum:
          - da-DK
          - de-AT
          - de-CH
          - de-DE
          - el-GR
          - en-AE
          - en-AU
          - en-CA
          - en-GB
          - en-HK
          - en-IE
          - en-IL
          - en-IN
          - en-MY
          - en-NZ
          - en-PH
          - en-PK
          - en-SG
          - en-US
          - en-ZA
          - es-AR
          - es-CL
          - es-CO
          - es-ES
