  /v1/shoppers/{shopperId}/factors/password:
    put:
      description: 'Notes:


        Password set is only supported by API Resellers setting subaccount passwords.


        **shopperId** is **not the same** as **customerId**. **shopperId** is a number of max length 10 digits (*ex:* 1234567890) whereas **customerId** is a UUIDv4 (*ex:* 295e3bc3-b3b9-4d95-aae5-ede41a994d13)'
      tags:
      - Shoppers
      parameters:
      - description: Shopper whose password will be set
        in: path
        name: shopperId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperId'
        '400':
          description: Request was not successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordError'
        '401':
          description: Authentication info not sent or invalid
