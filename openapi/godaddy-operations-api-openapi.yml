x-ext:
  e6ced4f:
    description: A universally unique identifier (UUID) in [RFC-4122 format](https://tools.ietf.org/html/rfc4122).
    type: string
    format: uuid
  40b48f1:
    title: Error Details
    type: object
    description: The error details. Required for client-side `4XX` errors.
    properties:
      field:
        type: string
        description: The field that caused the error. If the field is in the body, set this value to the JSON pointer to that field. Required for client-side errors.
      value:
        type: string
        description: The value of the field that caused the error.
      location:
        type: string
        description: The location of the field that caused the error. Value is `body`, `path`, or `query`.
        default: body
      issue:
        type: string
        description: The unique fine-grained application-level error code.
      description:
        type: string
        description: The human-readable description for an issue. The description MAY change over the lifetime of an API, so clients MUST NOT depend on this value.
    required:
    - issue
  590647a:
    title: Link Description
    type: object
    description: A request-related [HATEOAS link](https://datatracker.ietf.org/doc/html/draft-handrews-json-schema-hyperschema-02).
    properties:
      href:
        description: The complete target URL, or link, to use in combination with the method to make the related call, as defined by [RFC 6570 - URI Template](https://tools.ietf.org/html/rfc6570), with the addition of the `$`, `(`, and `)` characters for pre-processing. The `href` is the key HATEOAS component that links a completed call with a subsequent call.
        type: string
        format: uri
      rel:
        description: The [link relation type](https://tools.ietf.org/html/rfc5988#section-4), which is an identifier for a link that unambiguously describes the semantics of the link. For values, see [Link Relationship Types](https://www.iana.org/assignments/link-relations/link-relations.xhtml).
        type: string
      title:
        description: The link title.
        type: string
      targetMediaType:
        description: The [RFC 2046-defined media type](https://www.ietf.org/rfc/rfc2046.txt) that describes the link target.
        type: string
      targetSchema:
        description: The schema that describes the link target.
      method:
        description: The method to use to request the link target. For example, for HTTP, this might be `GET` or `DELETE`.
        type: string
      submissionMediaType:
        description: The media type with which to submit data with the request.
        type: string
        default: application/json
      submissionSchema:
        description: The schema that describes the request data.
    required:
    - rel
    - href
  21ae8c5:
    type: object
    title: Error
    description: The error information.
    definitions:
      error-details:
        $ref: '#/x-ext/40b48f1'
      link-description:
        $ref: '#/x-ext/590647a'
    properties:
      name:
        type: string
        description: The human-readable, unique name of the error.
      correlationId:
        type: string
        description: Internal identifier used for correlation purposes.
      message:
        type: string
        description: The message that describes the error.
      informationLink:
        type: string
        description: The URI for detailed information related to this error for the developer.
      details:
        type: array
        description: An array of additional details about the error. Required for client-side `4XX` errors.
        additionalItems: false
        items:
          $ref: '#/x-ext/21ae8c5/definitions/error-details'
      links:
        type: array
        description: An array of error-related HATEOAS links.
        readOnly: true
        items:
          $ref: '#/x-ext/21ae8c5/definitions/link-description'
          readOnly: true
    required:
    - name
    - correlationId
    - message
  c21d77b:
    title: Agreement Type
    description: 'The type of legal agreement that must be accepted prior to executing a domain operation. Additional agreement types may be returned for specific TLDs or product combinations. API_DPA - API Domain Purchase Agreement. DNTA — Domain Name Transfer Agreement. DNPA — Domain Name Privacy Agreement. HTTPS_NOTICE — HTTPS notice acknowledgment for eligible TLDs. AURA — AU Domain Agreement for .au TLD registrations and transfers. CIRA — Canadian Internet Registration Authority Agreement for .ca TLD registrations and transfers.

      '
    type: string
  3e9571a:
    title: Agreement
    description: 'A legal agreement that must be accepted prior to executing a domain operation. Agreements are returned in the quote response and must be acknowledged in the execute request via the consent.agreementTypes array.

      '
    type: object
    required:
    - agreementType
    - title
    properties:
      agreementType:
        allOf:
        - $ref: '#/x-ext/c21d77b'
        - description: 'The type of legal agreement. Identifies which agreement text the customer must accept.

            '
          example: API_DPA
      title:
        type: string
        description: 'Human-readable title of the agreement, suitable for display to the customer.

          '
        example: Domain Name Registration Agreement
      url:
        type: string
        format: uri
        description: URL to the full legal text of this agreement. Present when available.
        example: https://www.godaddy.com/agreements/showdoc?pageid=reg_sa
  d7ca784:
    title: Inventory Type
    description: 'The inventory source for a domain name. REGISTRY — standard registry price inventory. REGISTRY_PREMIUM — registry premium tier pricing. PREMIUM — third-party premium domain marketplace.

      '
    type: string
    enum:
    - REGISTRY
    - REGISTRY_PREMIUM
    - PREMIUM
  f7542cf:
    title: Term
    description: 'The unit of a registration period. YEAR — registration period is expressed in years.

      '
    type: string
    enum:
    - YEAR
  0163f63:
    type: string
    title: Currency Code
    description: A three-character ISO-4217 currency code.
    minLength: 3
    maxLength: 3
  18b18ae:
    type: object
    title: Simple Money
    description: The currency and amount for a financial transaction, such as a balance or payment due. Use for value representations with default transactable-value precision.
    properties:
      currencyCode:
        $ref: '#/x-ext/0163f63'
      value:
        type: integer
        format: int64
        description: The value, which might represent intergrals for currencies like `JPY` that are not typically fractional; or, with an implied decimal fraction for currencies like `TND` that are subdivided into thousandths. For the implied number of decimal places for a currency code, see [ISO-4217 Currency Codes](https://en.wikipedia.org/wiki/ISO_4217).
    required:
    - currencyCode
    - value
  22cbd6e:
    title: Fee Type
    description: 'The type of a fee charged at the time of purchase. ONE_TIME_PREMIUM_DOMAIN_PURCHASE — one-time acquisition cost charged by the aftermarket marketplace when purchasing a premium domain.

      '
    type: string
  a12fb6c:
    title: Fee
    description: 'Fees charged at the time of purchase, separate from the registration price. The type identifies the nature of the charge.

      '
    type: object
    required:
    - type
    - fee
    properties:
      type:
        allOf:
        - $ref: '#/x-ext/22cbd6e'
        - description: 'Identifies the nature of this charge. Determines how the fee is categorized in pricing breakdowns and receipts.

            '
          example: ONE_TIME_PREMIUM_DOMAIN_PURCHASE
      fee:
        allOf:
        - $ref: '#/x-ext/18b18ae'
        - description: The monetary amount of this fee.
  50f74db:
    title: Term Price
    description: 'Pricing for a single registration term (period and unit combination). A term is self-contained: the full cost of choosing it is price plus all fees listed here.

      '
    type: object
    required:
    - term
    - period
    - price
    properties:
      term:
        allOf:
        - $ref: '#/x-ext/f7542cf'
        - description: The unit of the registration period. Currently only YEAR is supported.
      period:
        type: integer
        minimum: 1
        maximum: 10
        description: Number of term units for this pricing entry.
        example: 1
      price:
        allOf:
        - $ref: '#/x-ext/18b18ae'
        - description: Registration price for this term and period.
      renewalPrice:
        allOf:
        - $ref: '#/x-ext/18b18ae'
        - description: 'Renewal price for this term and period. Absent when renewal pricing is unavailable or identical to the registration price.

            '
      firstTermPrice:
        $ref: '#/x-ext/18b18ae'
        description: 'Discounted price of only the first term unit within this multi-unit period. Typically omitted when period is 1 (where it equals price). Present when a first-term-only promotion applies to a multi-unit period.

          '
        example:
          currencyCode: USD
          value: 1199
      recommended:
        type: boolean
        description: 'When true, this term is the best-value option based on active discounts or promotions. At most one entry in the prices array carries this flag. Absent (not false) when no recommendation applies.

          '
        example: true
      fees:
        type: array
        description: 'Fees charged at the time of purchase for this term, in addition to price. Present when the domain incurs purchase fees beyond the base registration cost. The full cost of choosing this term is price plus these fees.

          '
        items:
          $ref: '#/x-ext/a12fb6c'
  8ac9047:
    title: Availability
    description: 'The availability check result for a single requested domain. A checkable domain returns the available flag plus optional pricing. A domain that could not be checked carries an error object and no availability fields. Exactly one of available or error is present per item.

      Availability is best-effort indicative; the authoritative availability check is performed at quote time. definitive: true means the result was confirmed directly with the registry rather than from a cached zone check.

      '
    type: object
    required:
    - domain
    properties:
      domain:
        type: string
        description: 'The domain name checked, normalized to punycode A-label form.

          '
        example: example.com
      unicodeDomain:
        type: string
        description: 'The Unicode (U-label) form of the domain. Present only for IDN domains.

          '
        example: münchen.de
      available:
        type: boolean
        description: 'Whether this domain appears to be available for registration. Best-effort; re-verified at quote time. Present only when the domain was successfully checked (no error).

          '
      definitive:
        type: boolean
        description: 'When true, the availability result was confirmed directly with the registry (ACCURACY mode). When false, the result is from a cached zone data check (SPEED mode) and may be stale.

          '
      inventory:
        allOf:
        - $ref: '#/x-ext/d7ca784'
        - description: 'The inventory source for this domain. Present when available is true and pricing fields are returned.

            '
          example: REGISTRY
      prices:
        type: array
        description: 'Multi-term pricing for this domain. Each entry represents a different registration period (e.g. 1 year, 2 years). Present when available is true.

          '
        items:
          $ref: '#/x-ext/50f74db'
      error:
        allOf:
        - $ref: '#/x-ext/21ae8c5'
        - description: 'Present when this domain could not be checked. One of available or error is present, never both. correlationId is required and should echo the X-Request-Id header value for this request.

            Common name values (aligned with v2 find API error codes): MISMATCH_FORMAT — the domain name does not conform to the expected format. UNSUPPORTED_TLD — the TLD is not supported for this account or check. INVALID_DOMAIN — the availcheck service reported a syntax error for this domain. ERROR_UNKNOWN — the check failed and could not be classified further.

            '
  ae5973b:
    title: Optimization Target
    description: 'How an availability check should prioritize speed vs. authoritative accuracy. SPEED — use cached zone data for a fast response (may be slightly stale). ACCURACY — perform a live registry check for authoritative availability (higher latency).

      '
    type: string
    enum:
    - SPEED
    - ACCURACY
  77ae6b4:
    title: Availability Check Criteria
    description: 'Request body for the POST /check-availability controller. Specifies the domain names to check and optional parameters that influence how the check is performed. The response returns one Availability result per requested domain in input order.

      This controller does not persist the check; there is no check identity or poll URL.

      '
    type: object
    required:
    - domains
    properties:
      domains:
        type: array
        minItems: 1
        maxItems: 25
        items:
          type: string
        description: 'List of 1–25 domain names to check, in punycode A-label form for IDNs.

          '
        example:
        - example.com
        - example.net
      optimizeFor:
        allOf:
        - $ref: '#/x-ext/ae5973b'
        - default: SPEED
          description: 'Optional. When omitted, defaults to SPEED. Availability is always re-verified authoritatively at quote time regardless of this setting.

            '
          example: SPEED
      iscCode:
        type: string
        description: 'Reseller ISC (International Shopper Code) for pricing context. When provided, the indicative prices in the results reflect the applicable reseller rates for this ISC.

          '
        example: ISC_PARTNER_001
  37bf2ab:
    description: 'A date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6). Note: The regular expression provides static schematic guidance but does not reject all invalid dates.'
    type: string
    minLength: 20
    maxLength: 64
    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
  2fe8a96:
    title: Consent Actor Type
    description: 'Who transmitted consent on behalf of the principal. DIRECT — the principal acted directly; actor is omitted. AGENT — an AI or automation acted on behalf of the principal. RESELLER — a reseller acted on behalf of a shopper.

      '
    type: string
  ffe7359:
    title: Consent Actor
    description: 'Identifies who gave consent and who transmitted it. One uniform schema for all actor types. Self-reported by the caller and treated as supplementary attestation; the server verifies principal against the resolved auth identity (OAuth token + X-Shopper-Id) and rejects with consent_principal_mismatch on disagreement. The persisted consent record is the union of this block and the verified auth context.

      principal identifies the account holder whose consent is being recorded. actor identifies the automated or intermediary party that transmitted the consent when different from the principal. For DIRECT, actor is omitted.

      '
    type: object
    x-sensitivity: confidential
    required:
    - type
    - principal
    properties:
      type:
        allOf:
        - $ref: '#/x-ext/2fe8a96'
        - description: 'Who transmitted consent relative to the principal.

            '
          example: DIRECT
      principal:
        type: string
        description: 'The shopper or account ID whose consent is being recorded. Must match the shopper resolved from the OAuth token and X-Shopper-Id header; mismatch returns consent_principal_mismatch.

          '
        example: shopper_123
      actor:
        type: string
        description: 'The automated agent or system that transmitted the consent. Omitted for DIRECT. For AGENT, identifies the specific agent instance. For RESELLER, may identify the reseller when distinct from the OAuth token subject.

          '
        example: agent:claude/atlas-1
      ip:
        type: string
        description: 'The IP address of the principal at the time consent was expressed, if known. Optional — an absent IP with a verified principal is preferred over a fabricated one.

          '
        example: 203.0.113.7
  fd3a330:
    title: Consent
    description: 'Customer consent record for a domain operation, capturing which legal agreements were accepted, which fees were acknowledged, when, and by whom. On execute, the caller supplies agreementTypes, agreedAt, and (when the quote carries fees) acknowledgedFees. The server derives agreedBy from the authenticated request context (OAuth identity, X-Shopper-Id, client IP, and transmission channel).

      '
    type: object
    required:
    - agreementTypes
    - agreedAt
    properties:
      agreementTypes:
        type: array
        minItems: 1
        items:
          $ref: '#/x-ext/c21d77b'
        description: 'The agreement types the customer accepted. Must match the agreementType values returned in the corresponding quote''s requiredAgreements array.

          '
        example:
        - API_DPA
      agreedAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: 'The timestamp at which the principal expressed consent. Should reflect when the customer clicked accept or confirmed the operation, not when the API call was made.

            '
      acknowledgedFees:
        type: array
        minItems: 1
        items:
          $ref: '#/x-ext/a12fb6c'
        description: 'Fees the customer explicitly acknowledged before executing the purchase.

          When the preceding quote''s `fees` array is non-empty, this field must be present and contain the same entries verbatim (same types, amounts, and currencies). The server validates this against the locked quote token; a mismatch is rejected with `422 quote_mismatch`. This field is not in `required` because the obligation is conditional on quote state and cannot be expressed as a schema constraint — its absence is enforced at the API layer, not by validation tooling.

          Contrast with `Registration.fees` (read-only): that field records what the server charged; this field records what the customer acknowledged. Both share the Fee type.

          Omit when the quote carries no purchase fees (standard REGISTRY registration).

          '
        example:
        - type: ONE_TIME_PREMIUM_DOMAIN_PURCHASE
          fee:
            value: 390000
            currencyCode: USD
      agreedBy:
        allOf:
        - $ref: '#/x-ext/ffe7359'
        - description: 'Who gave consent and how it was transmitted. Server-derived from the execute request''s auth context.

            '
          readOnly: true
  0f0d62a:
    title: DNS Record Type
    description: 'The DNS resource record type. A — IPv4 address record. AAAA — IPv6 address record. CNAME — canonical name alias record; not permitted at the zone apex. MX — mail exchange routing record. TXT — arbitrary text record, used for SPF, DKIM, and domain verification. NS — authoritative name server delegation record. SRV — service locator record. SOA — start of authority record. CAA — certification authority authorization record.

      '
    type: string
    enum:
    - A
    - AAAA
    - CNAME
    - MX
    - TXT
    - NS
    - SRV
    - SOA
    - CAA
  b820fe6:
    title: DNS Record
    description: A single DNS resource record within a zone.
    type: object
    required:
    - name
    - type
    - data
    - ttl
    properties:
      recordId:
        type: string
        description: Server-assigned identifier for this DNS record. Stable across updates.
        readOnly: true
        example: rec_a1b2c3d4
      name:
        type: string
        minLength: 1
        maxLength: 255
        description: 'The DNS record name relative to the zone apex. Use @ to represent the zone apex itself (e.g. the bare domain example.com).

          '
        example: www
      type:
        allOf:
        - $ref: '#/x-ext/0f0d62a'
        - description: The DNS resource record type.
      data:
        type: string
        minLength: 1
        maxLength: 512
        description: 'The record value. Format is type-specific — for example, an IPv4 address for A records, or a hostname for CNAME and MX records.

          '
        example: 93.184.216.34
      ttl:
        type: integer
        minimum: 600
        maximum: 86400
        description: Time-to-live in seconds. Controls how long resolvers cache this record.
        example: 3600
      priority:
        type: integer
        minimum: 0
        maximum: 65535
        description: Priority value for MX and SRV records. Lower values are preferred.
      service:
        type: string
        description: Service label for SRV records (e.g. _http).
      port:
        type: integer
        minimum: 0
        maximum: 65535
        description: Port number for SRV records.
      weight:
        type: integer
        minimum: 0
        maximum: 65535
        description: 'Weight for SRV load balancing among records with equal priority. Higher weight increases the probability of selection.

          '
      protocol:
        type: string
        description: Protocol identifier for SRV records (e.g. _tcp, _udp).
      flag:
        type: integer
        minimum: 0
        maximum: 255
        description: 'Flag byte for CAA records. 0 indicates non-critical; 128 indicates critical (the issuer must understand the tag property to proceed).

          '
      tag:
        type: string
        description: 'Tag property for CAA records. Common values: issue, issuewild, iodef.

          '
  e0e1d47:
    title: DNS Records
    description: 'Paginated collection of DNS resource records for a zone. HATEOAS links provide navigation to adjacent pages.

      '
    type: object
    required:
    - items
    - links
    properties:
      items:
        type: array
        description: DNS records for the current page.
        items:
          $ref: '#/x-ext/b820fe6'
      totalItems:
        type: integer
        minimum: 1
        description: 'Total number of records in the zone. Only present when totalRequired=true was passed in the request and the zone contains at least one record.

          '
      totalPages:
        type: integer
        minimum: 1
        description: 'Total number of pages at the requested pageSize. Only present under the same conditions as totalItems.

          '
      links:
        type: array
        items:
          $ref: '#/x-ext/590647a'
        description: 'HATEOAS pagination links. rel=self — this page. rel=next — next page (absent on the last page). rel=prev — previous page (absent on the first page).

          '
        readOnly: true
  bf9c5f0:
    title: Nameserver Hostname
    description: A fully qualified domain name for an authoritative nameserver.
    type: string
    minLength: 1
    maxLength: 253
    example: ns1.domaincontrol.com
  26eb9a5:
    title: Name Servers
    description: 'Ordered list of authoritative nameserver hostnames for a domain. The first entry is primary; subsequent entries are secondaries. A minimum of two nameservers is required; the maximum is thirteen.

      '
    type: array
    minItems: 2
    maxItems: 13
    items:
      $ref: '#/x-ext/bf9c5f0'
    example:
    - ns1.domaincontrol.com
    - ns2.domaincontrol.com
  b594312:
    title: Domain Status
    description: 'The lifecycle state of a registered domain. ACTIVE — domain is registered and resolving normally. EXPIRED — domain has passed its expiration date; renewal still possible during the grace period. CANCELLED — domain registration has been cancelled and released. CANCELLED_REDEEMABLE — cancelled domain still within the redemption grace period. PENDING_TRANSFER — inbound transfer from another registrar is in progress. TRANSFERRED_OUT — domain was transferred to another registrar. LOCKED — domain has a registry-level administrative lock applied.

      '
    type: string
    enum:
    - ACTIVE
    - EXPIRED
    - CANCELLED
    - CANCELLED_REDEEMABLE
    - PENDING_TRANSFER
    - TRANSFERRED_OUT
    - LOCKED
  7244d8c:
    title: Domain
    description: 'Full management state for a registered domain owned by the authenticated account. Includes registration metadata, expiration timestamps, lifecycle settings, current nameservers, and HATEOAS links for sub-resource navigation.

      '
    type: object
    required:
    - domain
    - status
    - expiresAt
    - createdAt
    - autoRenew
    - privacy
    properties:
      domain:
        type: string
        description: The domain name in punycode A-label form.
        readOnly: true
        example: example.com
      idnDomain:
        type: string
        description: 'The internationalized (U-label) representation of the domain name. Only present for internationalized domain names (IDNs).

          '
        readOnly: true
        example: 例え.jp
      status:
        allOf:
        - $ref: '#/x-ext/b594312'
        - description: Current lifecycle state of the domain.
          readOnly: true
      expiresAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp when the domain registration expires.
          readOnly: true
      createdAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp when the domain was originally registered at GoDaddy.
          readOnly: true
      renewBy:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: 'Deadline by which the domain must be renewed to avoid expiration consequences. May precede expiresAt due to registry-specific renewal windows.

            '
          readOnly: true
      updatedAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp of the most recent management state change.
          readOnly: true
      autoRenew:
        type: boolean
        description: Whether the domain will be renewed automatically before expiration.
      privacy:
        type: boolean
        description: Whether WHOIS privacy protection is currently enabled on the domain.
      transferLock:
        type: boolean
        description: 'Whether the registry transfer-lock (clientTransferProhibited) is engaged. When true, outbound transfers to another registrar are blocked at the registry.

          '
      nameServers:
        allOf:
        - $ref: '#/x-ext/26eb9a5'
        - description: Current authoritative nameservers for this domain.
          example:
          - ns1.domaincontrol.com
          - ns2.domaincontrol.com
      links:
        type: array
        items:
          $ref: '#/x-ext/590647a'
        description: 'HATEOAS links for domain sub-resources. rel=self — canonical URL for this domain resource. rel=nameservers — nameserver management sub-resource. rel=contacts — contact management sub-resource. rel=privacy — privacy toggle sub-resource. rel=auto-renew — auto-renewal setting sub-resource. rel=transfer-lock — transfer lock setting sub-resource.

          '
        readOnly: true
  e16f6a6:
    title: Domain Operation Type
    description: 'The type of asynchronous domain operation. Used to distinguish which workflow is being polled on the /operations/{operationId} endpoint. REGISTER — new domain registration.

      '
    type: string
  a701138:
    title: Domain Operation Status
    description: 'The execution state of an asynchronous domain operation. CONFIRMED — operation has been accepted and is queued for execution. EXECUTING — operation is actively being processed by the registry or downstream systems. COMPLETED — operation finished successfully; result data is available. FAILED — operation terminated with an unrecoverable error; error detail is attached.

      '
    type: string
  3becb0e:
    title: Domain Operation Result
    description: 'The terminal success payload for a completed domain operation. Returned on the parent DomainOperation when status is COMPLETED. Absent for non-terminal statuses (CONFIRMED, EXECUTING) and for FAILED operations.

      Once status reaches COMPLETED it is terminal: result is populated, remains available on subsequent polls, and status does not revert. Interpret the fields present in result using the parent operation''s type:

      REGISTER — expiresAt, orderId.

      '
    type: object
    readOnly: true
    properties:
      expiresAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: 'New domain expiry date. Present for REGISTER and RENEW operations.

            '
      orderId:
        type: string
        description: 'The commerce order ID associated with the charge. Present for commercial operations (REGISTER, RENEW, TRANSFER_IN).

          '
        example: ord_abc123
      updatedAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: 'Timestamp of the completed non-commercial mutation.

            '
  51563a3:
    title: Domain Operation
    description: "The abstract operation envelope for all domain mutations, returned by the universal GET /operations/{operationId} endpoint. Concrete specializations — Registration, Renewal, and Transfer — are returned directly by their respective POST endpoints and carry the same operationId. Developers who do not need the abstract view can poll the concrete resource (GET /registrations/{id}, etc.) and ignore this type entirely.\nOperation IDs are unique across all concrete types, so either poll path works for any given operation.\nAsync state machine:\n  status tracks where the operation is in its lifecycle. Non-terminal values\n  (CONFIRMED, EXECUTING) are transient — poll until a terminal value is reached.\n  result and error are mutually exclusive terminal payloads:\n    COMPLETED — operation succeeded; result contains the final outcome data.\n    FAILED — operation terminated; error contains failure detail.\n  Neither result nor error is present while status is non-terminal.\n"
    type: object
    required:
    - operationId
    - type
    - status
    properties:
      operationId:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'Stable, server-assigned identifier for this operation. Unique across all operation types. Use to poll GET /operations/{operationId}. Matches the operationId on the corresponding concrete resource (e.g. Registration).

            '
          readOnly: true
          example: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
      type:
        allOf:
        - $ref: '#/x-ext/e16f6a6'
        - description: 'The type of operation being tracked. Determines which fields appear in result on COMPLETED and the concrete resource collection (REGISTER → /registrations, RENEW → /renewals, TRANSFER_IN → /transfers).

            '
          readOnly: true
      domain:
        type: string
        description: The domain name this operation applies to.
        readOnly: true
        example: example.com
      status:
        allOf:
        - $ref: '#/x-ext/a701138'
        - description: 'Current position in the operation lifecycle. Poll until COMPLETED or FAILED. Non-terminal while CONFIRMED or EXECUTING; terminal values are mutually exclusive with each other and do not revert.

            '
          readOnly: true
      result:
        allOf:
        - $ref: '#/x-ext/3becb0e'
        - description: 'Present when status is COMPLETED. Absent while non-terminal and when status is FAILED.

            '
        readOnly: true
      error:
        allOf:
        - $ref: '#/x-ext/21ae8c5'
        - description: 'Present when status is FAILED. Absent while non-terminal and when status is COMPLETED.

            '
        readOnly: true
      links:
        type: array
        items:
          $ref: '#/x-ext/590647a'
        description: 'HATEOAS link relations for this operation. rel=self — the canonical URL for this abstract operation view. rel=registration, rel=renewal, or rel=transfer — the same resource viewed through its concrete typed collection. rel=domain — the domain-name resource affected by this operation.

          '
        readOnly: true
      createdAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp when this operation was created.
          readOnly: true
      updatedAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp of the most recent status update.
          readOnly: true
  4945a71:
    description: 'A valid, internationalized email address. Note: Up to 64 characters are allowed before and 255 characters are allowed after the @ sign. However, the generally accepted maximum length for an email address is 254 characters. The pattern verifies that an unquoted @ sign exists.'
    type: string
    minLength: 3
    maxLength: 254
    pattern: ^.+@[^"\-].+$
  31009c4:
    type: object
    title: Phone
    description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
    properties:
      countryCode:
        type: string
        description: The country calling code (CC), in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the CC and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
        minLength: 1
        maxLength: 3
        pattern: ^[0-9]{1,3}?$
      nationalNumber:
        type: string
        description: The national number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). The combined length of the country calling code (CC) and the national number must not be greater than 15 digits. The national number consists of a national destination code (NDC) and subscriber number (SN).
        minLength: 1
        maxLength: 14
        pattern: ^[0-9]{1,14}?$
      extensionNumber:
        type: string
        description: The extension number.
        minLength: 1
        maxLength: 15
        pattern: ^[0-9]{1,15}?$
    required:
    - countryCode
    - nationalNumber
  56f80e0:
    description: A two-character ISO 3166-1 code that identifies the country or region.
    type: string
    maxLength: 2
    minLength: 2
    pattern: ^([A-Z]{2}|C2)$
  20f26ae:
    type: object
    title: Simple Postal Address (Coarse-Grained)
    description: Simple postal address with coarse-grained fields. Do not use for international postal addresses. Use for backward compatibility only. Address does not contain a phone number.
    properties:
      line1:
        type: string
        description: The first line of the address. For example, number or street.
        maxLength: 300
      line2:
        type: string
        description: The second line of the address. For example, suite or apartment number.
        maxLength: 300
      city:
        type: string
        description: The city name.
        maxLength: 300
      state:
        type: string
        description: The [code](https://about.usps.com/who/profile/history/state-abbreviations.htm) for a US state or the equivalent for other countries.
        maxLength: 300
      countryCode:
        $ref: '#/x-ext/56f80e0'
        description: 'The [two-character ISO 3166-1 code](https://en.wikipedia.org/wiki/ISO_3166-1) that identifies the country or region. Note: The country code for Great Britain is `GB` and not `UK` as used in the top-level domain names for that country. Use country code `C2` for China for comparable uncontrolled price (CUP) method, bank-card, and cross-border transactions.'
      postalCode:
        type: string
        description: The postal code, which is the zip code or equivalent. Typically required for countries that have a postal code or an equivalent. See [Postal Code](https://en.wikipedia.org/wiki/Postal_code).
        maxLength: 60
    required:
    - line1
    - city
    - countryCode
  c8dda8d:
    title: Contact
    description: 'An ICANN-required contact record for a domain registration. Covers registrant, administrative, technical, and billing roles. Identity fields are validated at registration-profile save time.

      '
    x-sensitivity: confidential
    type: object
    required:
    - firstName
    - lastName
    - email
    - phone
    - address
    properties:
      firstName:
        type: string
        minLength: 1
        maxLength: 60
        description: The contact's first (given) name.
        x-sensitivity: confidential
        example: Jane
      lastName:
        type: string
        minLength: 1
        maxLength: 60
        description: The contact's last (family) name.
        x-sensitivity: confidential
        example: Smith
      organization:
        type: string
        maxLength: 100
        description: 'Organization or company name. Required for contacts acting on behalf of a legal entity. Leave blank for individual registrants.

          '
        x-sensitivity: confidential
        example: Example LLC
      email:
        allOf:
        - $ref: '#/x-ext/4945a71'
        - example: foo@bar.com
        - description: 'The contact''s email address. Used for registry WHOIS and renewal notifications.

            '
          x-sensitivity: confidential
      phone:
        allOf:
        - $ref: '#/x-ext/31009c4'
        - example:
            countryCode: '1'
            nationalNumber: '4805551234'
        - description: 'The contact''s phone number. Pass as an object with `countryCode` (E.164 country calling code digits, e.g. `"1"` for the US) and `nationalNumber` (national number digits without formatting, e.g. `"4805551234"`). Required by ICANN for all contact roles.

            '
          x-sensitivity: confidential
      address:
        allOf:
        - $ref: '#/x-ext/20f26ae'
        - description: 'The contact''s mailing address for WHOIS and ICANN records.

            '
          x-sensitivity: confidential
  67999d5:
    title: Contacts
    description: 'The set of ICANN-required contact roles for a domain registration. Registrant is required; admin, tech, and billing cascade from the registrant when omitted. Merge rule across resolution layers (saved profile, inline registration profile): identity fields replace as a whole block per role.

      '
    x-sensitivity: confidential
    type: object
    required:
    - registrant
    properties:
      registrant:
        allOf:
        - $ref: '#/x-ext/c8dda8d'
        - description: 'The legal owner of the domain. Required. The registrant''s identity is the authoritative WHOIS record and is bound by ICANN registration agreements.

            '
      admin:
        allOf:
        - $ref: '#/x-ext/c8dda8d'
        - description: 'The administrative contact, responsible for managing the domain on behalf of the registrant. Cascades from registrant when omitted.

            '
      tech:
        allOf:
        - $ref: '#/x-ext/c8dda8d'
        - description: 'The technical contact, responsible for DNS and nameserver configuration. Cascades from registrant when omitted.

            '
      billing:
        allOf:
        - $ref: '#/x-ext/c8dda8d'
        - description: 'The billing contact, receives invoices and renewal notices. Cascades from registrant when omitted.

            '
  c521303:
    title: Inline Registration Profile
    description: 'A one-time, non-persisted set of contacts and purchase preference defaults supplied inline on a quote or execute request. Use to provide registration data for this transaction without creating or updating a saved registration profile.

      Shared by the registration quote and execute request bodies. Every field is optional. Omitted fields account identity or other default values. Provided fields override only what is supplied — contact roles replace as a whole block; preference fields replace individually.

      This is not a saved registration profile and is not JSON Patch. Data here applies only to the current quote or registration request.

      '
    type: object
    properties:
      contacts:
        allOf:
        - $ref: '#/x-ext/67999d5'
        - description: 'Contact records for this request. Each role provided replaces that role from the resolved saved profile or account identity. Omitted roles continue to resolve from the saved profile or cascade from registrant.

            '
      autoRenew:
        type: boolean
        description: 'Auto-renew preference for this registration. Omit to inherit from the resolved saved profile or account defaults.

          '
      privacy:
        type: boolean
        description: 'WHOIS privacy preference for this registration. Omit to inherit from the resolved saved profile or account defaults.

          '
      nameServers:
        type: array
        minItems: 2
        maxItems: 13
        items:
          type: string
          description: Fully-qualified nameserver hostname.
        description: 'Authoritative nameservers for this registration. Omit to inherit from the resolved saved profile or platform defaults.

          '
        example:
        - ns1.example.com
        - ns2.example.com
  a83bac3:
    title: Registration
    description: 'A domain registration entity created when a POST /registrations request is accepted. Registrations are a top-level resource with their own stable registrationId; the domain relationship is captured in the representation.

      On POST /registrations, supply the writable fields (domain, period, quoteToken, consent, and optionally profileId/profile). The server returns the full Registration with readOnly fields populated. Poll links[rel=self] until status reaches COMPLETED or FAILED. The same resource is also reachable via GET /operations/{operationId} for clients operating at the abstract level; operationId is included in the representation for that purpose.

      '
    type: object
    required:
    - domain
    - quoteToken
    - consent
    properties:
      registrationId:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'Server-assigned stable identifier for this registration record.

            '
          readOnly: true
      domain:
        type: string
        description: 'The domain name to register, in punycode A-label form for IDNs. Must match the domain in the quoteToken.

          '
        example: example.com
      period:
        type: integer
        minimum: 1
        maximum: 10
        default: 1
        description: Registration period in years. Must match the period in the quote.
        example: 1
      profileId:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'ID of a saved registration profile to use for contacts and preference defaults. Omit to fall back to the account-default profile for the domain''s TLD, then to account identity.

            '
      profile:
        allOf:
        - $ref: '#/x-ext/c521303'
        - description: 'One-time inline contacts and purchase preference defaults for this registration. Not persisted. Must match the profile supplied on the quote when a profile was included at quote time.

            '
      quoteToken:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'The single-use opaque token from the preceding quoteDomainRegistration call. Required. Consumed on first successful execution; idempotent retries with the same Idempotency-Key replay the original operation without re-consuming.

            '
          writeOnly: true
          example: 7f3a2b1c-9d8e-4012-a5b6-c1d2e3f4a5b6
      consent:
        allOf:
        - $ref: '#/x-ext/fd3a330'
        - description: 'The customer''s consent record for the legal agreements returned in the quote. Must reference the same agreementTypes as the quote.

            '
      price:
        allOf:
        - $ref: '#/x-ext/18b18ae'
        - description: 'The locked registration price for the quoted period. Held for the duration of the quoteToken''s TTL. Total amount charged on execute is this price plus any fees on this registration.

            '
          readOnly: true
      fees:
        type: array
        description: 'Fees charged at the time of purchase, in addition to the registration price. Present when purchase fees were incurred. Same fees as RegistrationQuote.fees (the selected term''s TermPrice.fees) from the preceding quote.

          '
        items:
          $ref: '#/x-ext/a12fb6c'
        readOnly: true
      status:
        allOf:
        - $ref: '#/x-ext/a701138'
        - description: Current execution status of this registration.
          readOnly: true
      operationId:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'Identifier of the DomainOperation tracking this registration. Same value returned by GET /operations/{operationId} for abstract operation tracking.

            '
          readOnly: true
          example: 9f1c2e7a-4b3d-4e8f-a1c2-3d4e5f6a7b8c
      expiresAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: 'The domain''s expiry date once the registration completes. Present only when status is COMPLETED.

            '
          readOnly: true
      createdAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp when this registration was initiated.
          readOnly: true
      updatedAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: Timestamp of the most recent status update.
          readOnly: true
      links:
        type: array
        items:
          $ref: '#/x-ext/590647a'
        description: 'HATEOAS link relations for this registration. rel=self — the canonical URL for this registration record. rel=domain — the registered domain-name resource once the registration is complete.

          '
        readOnly: true
  a114951:
    title: Contact Source
    description: 'Where the resolved registrant contact came from. INLINE — contact was supplied via an inline registration profile on the request. PROFILE — contact was resolved from a named or default saved profile. ACCOUNT — contact was derived from the authenticated principal''s account identity (no profile supplied or on file).

      '
    type: string
    enum:
    - INLINE
    - PROFILE
    - ACCOUNT
  51108fa:
    title: Resolved Settings
    description: 'A preview of the effective settings that will be applied if the associated quote is executed. Returned in the quote response to eliminate invisible side effects — the caller sees exactly whose contact info and which preferences will be used before making a commitment. contactSource names where the registrant contact came from so an agent can be explicit at the confirmation step.

      '
    type: object
    properties:
      profileId:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'The saved registration profile that was applied, if any. Absent when the registrant was derived from account identity.

            '
          readOnly: true
          example: 14514a29-5fce-4624-8d8a-d8abd56015e2
      contactSource:
        allOf:
        - $ref: '#/x-ext/a114951'
        - description: 'Indicates where the resolved registrant contact came from. When ACCOUNT, the agent should surface this clearly to the customer before confirmation.

            '
          example: PROFILE
      registrantSummary:
        type: string
        description: 'A human-readable one-line summary of the resolved registrant, suitable for display in a confirmation prompt. When contactSource is ACCOUNT, the summary is suffixed with "(account identity)" to make the derivation explicit.

          '
        x-sensitivity: confidential
        example: Jane Smith / jane@example.com
      autoRenew:
        type: boolean
        description: 'The effective auto-renew setting that will be applied upon registration.

          '
      privacy:
        type: boolean
        description: 'The effective WHOIS privacy setting that will be applied upon registration.

          '
      nameServers:
        type: array
        items:
          type: string
          description: Fully-qualified nameserver hostname.
        description: 'The effective nameservers that will be provisioned for the domain.

          '
        example:
        - ns01.domaincontrol.com
        - ns02.domaincontrol.com
  f64cd91:
    title: Registration Quote
    description: 'A price quote for registering a single domain. Contains a locked price, resolved contact and preference settings, required legal agreements, and a short-lived single-use quoteToken that must be presented on the subsequent registration execute call. Execution without a valid quoteToken is structurally impossible.

      When available is false, no quoteToken is returned — this is not an error; it means the domain cannot be registered as requested.

      '
    type: object
    required:
    - domain
    - available
    properties:
      quoteToken:
        allOf:
        - $ref: '#/x-ext/e6ced4f'
        - description: 'Opaque, single-use token with a 10-minute TTL. References the locked price, a hash of this request body, and a hash of the resolved profile values. Absent when available is false. Treat as a capability; do not parse.

            '
          example: 7f3a2b1c-9d8e-4012-a5b6-c1d2e3f4a5b6
      expiresAt:
        allOf:
        - $ref: '#/x-ext/37bf2ab'
        - description: 'The expiry timestamp of the quoteToken. After this time, presenting the token on execute returns quote_expired and a new quote must be obtained.

            '
      domain:
        type: string
        description: 'The domain name being quoted, in punycode A-label form for IDNs.

          '
        example: example.com
      available:
        type: boolean
        description: 'Whether the domain is available for registration. When false, no quoteToken is returned. The availability check at quote time is authoritative; a name sniped between suggest/availability and quote fails cleanly here.

          '
      price:
        allOf:
        - $ref: '#/x-ext/18b18ae'
        - description: 'The locked registration price for the quoted period. Held for the duration of the quoteToken''s TTL. Total amount charged on execute is this price plus any fees on this quote.

            '
      renewalPrice:
        allOf:
        - $ref: '#/x-ext/18b18ae'
        - description: 'Indicative renewal cost at current rates. Not a price guarantee; renewal pricing is locked at time of renewal quote.

            '
      period:
        type: integer
        minimum: 1
        maximum: 10
        description: Registration period in years for which the price is quoted.
        example: 1
      resolved:
        allOf:
        - $ref: '#/x-ext/51108fa'
        - description: 'The effective contact and preference settings that will be applied on execute. Review before execute to verify registrant, contacts, and preferences match intent.

            '
      requiredAgreements:
        type: array
        items:
          $ref: '#/x-ext/3e9571a'
        description: 'Legal agreements that must be accepted before executing this quote. The agreementType values from this list must be included in the execute request''s consent object.

          '
      irreversible:
        type: boolean
        description: 'Whether executing this quote is irreversible once accepted. Use to calibrate the explicitness of any confirmation step presented before execute.

          '
        example: false
      inventory:
        allOf:
        - $ref: '#/x-ext/d7ca784'
        - description: 'The inventory type of the quoted domain. Present when available is true.

            '
          readOnly: true
      fees:
        type: array
        description: 'Fees charged at the time of purchase, in addition to the registration price. Present when the domain incurs purchase fees beyond the base registration cost.

          These are the same fees as TermPrice.fees for the selected term (this quote''s period) — not a separate term-independent fee list and not additional to term-level fees. Execute cost is price plus this array. Mirrored on Registration.fees after execute.

          '
        items:
          $ref: '#/x-ext/a12fb6c'
  a4552e9:
    title: Suggestion
    description: 'A single available domain suggestion returned by the suggest endpoint. Availability is implied by presence in the results (available-only contract) and is best-effort — the availability check at quote time is the authoritative re-check. Indicative pricing may be stale; the locked price is established at quote time only.

      '
    type: object
    required:
    - domain
    properties:
      domain:
        type: string
        description: 'The suggested domain name in punycode A-label form.

          '
        example: sunrisebakery.com
      prices:
        type: array
        description: 'Multi-term pricing for this suggestion. Each entry represents a different registration period. Indicative only — the locked price is established at quote time.

          '
        items:
          $ref: '#/x-ext/50f74db'
      inventory:
        allOf:
        - $ref: '#/x-ext/d7ca784'
        - description: 'The inventory source for this domain. Present when pricing fields are present.

            '
          example: REGISTRY
  0dbf450:
    title: DomainCollection
    description: 'A paginated collection of registered domains owned by the authenticated account. Supports filtering by status and cursor-based pagination.

      '
    type: object
    required:
    - items
    - links
    properties:
      items:
        type: array
        description: Domains for the current page.
        items:
          $ref: '#/x-ext/7244d8c'
      links:
        type: array
        items:
          $ref: '#/x-ext/590647a'
        description: 'HATEOAS pagination links. May include rel=self (current page),  rel=prev is present when more items are available before the current page. and rel=next is present when more items are available beyond the current page.

          '
        readOnly: true
  847c074:
    title: Domain Lifecycle Group
    description: 'A logical grouping of domain lifecycle statuses for filtering purposes. PENDING — domain setup is in progress (e.g. PENDING_REGISTRATION). REGISTERED — domain is actively registered and operational (e.g. ACTIVE, PARKED). PENDING_TERMINAL — domain is approaching a terminal state (e.g. PENDING_TRANSFER, EXPIRED). TERMINAL — domain has reached a terminal state and is no longer manageable (e.g. CANCELLED, DELETED_REDEEMABLE, TRANSFERRED, REPOSSESSED).

      '
    type: string
    examples:
    - PENDING
    - REGISTERED
    - PENDING_TERMINAL
    - TERMINAL
  6d77c8e:
    title: Suggestion Source
    description: 'A suggestion source strategy that generates domain name variations. EXTENSION — vary the TLD. KEYWORD_SPIN — rotate keywords. CC_TLD — vary using country-code TLDs. PREMIUM — include premium-priced variations.

      '
    type: string
    enum:
    - CC_TLD
    - EXTENSION
    - KEYWORD_SPIN
    - PREMIUM
