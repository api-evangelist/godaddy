          - FAST
          - FULL
          - fast
          - full
          default: FAST
      - description: Whether or not to include domains available for transfer. If set to True, checkType is ignored
        in: query
        name: forTransfer
        required: false
        schema:
          type: boolean
          default: false
      responses:
