        validEndDate:
          format: date-time
          type: string
        validStartDate:
          format: date-time
          type: string
        validationType:
          $ref: '#/components/schemas/CertificateValidationType'
      required:
      - certificateId
      - domain
      - period
      - requestDate
      - status
      - type
      - validationType
      type: object
