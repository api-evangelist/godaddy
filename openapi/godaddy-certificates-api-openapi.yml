components:
  schemas:
    CertificateReissueV2:
      properties:
        csr:
          default: New CSR, required for rekey only. Changes to common name or subject alternative names will be rejected.
          description: Certificate Signing Request.
          type: string
        revokeExistingCertificate:
          default: false
          description: Whether to revoke existing certificate upon issuance of new certificate
          type: boolean
        delayExistingRevoke:
          default: 72
          description: In hours, time to delay revoking existing certificate after issuance of new certificate. If revokeExistingCertOnIssuance is enabled, this value will be ignored
          maximum: 168
          type: integer
        forceDomainRevetting:
          description: Optional field. Domain verification will be required for each domain listed here. Specify a value of * to indicate that all domains associated with the request should have their domain information reverified.
          items:
            type: string
          type: array
          uniqueItems: true
    CertificateOrganizationCreate:
      properties:
        address:
          $ref: '#/components/schemas/CertificateAddress'
          description: Organization presence address
        assumedName:
          description: Only for EVSSL. The DBA(does business as) name for the organization.
          type: string
        name:
          description: Name of organization that owns common name
          type: string
        phone:
          description: Phone number for organization
          type: string
        registrationAgent:
          description: Only for EVSSL.
          type: string
        registrationNumber:
          description: Only for EVSSL.
          type: string
      required:
      - name
      - phone
    CertificateDetails:
      properties:
        certificateId:
          type: string
        completionDate:
          format: date-time
          type: string
        domain:
          $ref: '#/components/schemas/Domain'
