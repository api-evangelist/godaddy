    CertificateStatus:
      description: "The certificate lifecycle stage. <br>\nActive, Expired, and Revoked are all Issued certificates. <br>\nActive means the validity period includes today. <br>\nExpired means the validity period was prior to today. <br>\nRevoked means that the certificate has been revoked. <br>\nPending means that the certificate is still going through the issuance process and has not been signed or issued yet. <br>\nDenied means that the certificate went from pending to denied for any valid denial reason. \n(Customer canceled request, CAA records exist for the domain, fraud, etc...)\n"
      enum:
      - ACTIVE
      - DENIED
      - EXPIRED
      - PENDING
      - REVOKED
      type: string
    Page:
      default: '1'
      description: The page number.
      format: int32
      minimum: 1
      type: integer
    CertificateType:
      description: The type of certificate in terms of the number of applicable domains.
      enum:
      - SINGLE
      - UCC
      - WILDCARD
      type: string
    CertificateContact:
      properties:
        email:
          description: Email address of requestor contact
          type: string
        jobTitle:
          description: Only used for EVSSL. Job title of requestor contact
          type: string
        nameFirst:
          description: First name of requestor contact
          type: string
        nameLast:
          description: Last name of requestor contact
          type: string
        nameMiddle:
          description: Middle initial of requestor contact
          type: string
        phone:
          description: Phone number for requestor contact
          type: string
        suffix:
          description: Suffix of requestor contact
          type: string
      required:
      - nameFirst
      - nameLast
      - email
      - phone
    Domain:
      description: 'A domain, subject alternative name, or alias.

        '
      example: example.com
      type: string
    ArrayOfCertificateAction:
      type: array
      items:
        $ref: '#/components/schemas/CertificateAction'
  parameters:
    SubscriptionPageSize:
      description: 'The number of records to return per query.

        '
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        format: int32
        default: '15'
    DomainParam:
      in: query
      name: domain
      required: false
      description: 'Filter by domain name / common name.

        This will look for the text inside the content of the domain.

        This is not a "find domains that start with x" search.

        '
      schema:
        type: string
    CertificateStatusParam:
      in: query
      name: status
      required: false
      description: "The certificate lifecycle stage. <br>\nActive, Expired, and Revoked are all Issued certificates. <br>\nActive means the validity period includes today. <br>\nExpired means the validity period was prior to today. <br>\nRevoked means that the certificate has been revoked. <br>\nPending means that the certificate is still going through the issuance process and has not been signed or issued yet. <br>\nDenied means that the certificate went from pending to denied for any valid denial reason. \n(Customer canceled request, CAA records exist for the domain, fraud, etc...)\n"
      schema:
        type: string
        enum:
        - ANY
        - ACTIVE
        - DENIED
        - EXPIRED
        - PENDING
        - REVOKED
        default: ANY
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: The number of records to return per query.
      schema:
        type: integer
        format: int32
        default: '15'
    CertificateTypeParam:
      in: query
      name: type
      required: false
      description: The type of certificate in terms of the number of applicable domains.
      schema:
        type: string
        enum:
        - ANY
        - SINGLE
        - UCC
        - WILDCARD
        default: ANY
    PageParam:
      name: page
      in: query
      required: false
      description: 'The page number. <b>(First page is <i>one</i> instead of zero.)</b>

        '
      schema:
        type: integer
        format: int32
        default: '1'
        minimum: 1
    CertificateValidationTypeParam:
      in: query
      name: validation
      required: false
      description: "The validation type for the certificate. \nStandard/Basic Validation (DV). \nOrganizational/Deluxe Vetting (OV).\nExtended/Premium Validation (EV).\n"
      schema:
        type: string
        enum:
        - ANY
        - DV
        - EV
        - OV
        default: ANY
    SubscriptionGuidParam:
      description: The Subscription GUID containing the certificates being requested.
      in: path
      name: guid
      required: true
      schema:
        type: string
        default: 217c6432-b892-4d74-a75e-0e37b5dc30a0
